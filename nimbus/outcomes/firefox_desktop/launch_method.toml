[metrics.number_of_autostart_launches]
friendly_name = "Number of Launches Using Autostart"
data_source = "metrics"
aggregation = "count_where"
cumulative_window = 7
repeat_windows = true

[[metrics.number_of_autostart_launches.where]]
column = "metrics.string.os_environment_launch_method"
op = "="
value = "Autostart"

