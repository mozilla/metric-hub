[metrics.pdf_free_highlight]
data_source = "metrics"
aggregation = "sum"
column = { map = "metrics.labeled_counter.pdfjs_editing_highlight_kind", key = "free_highlight" }
threshold = { op = ">", value = 0 }
cumulative_window = 7
repeat_windows = true

