# Jetstream config for set-up-your-email-web-app-spotlight-7-28-day-old-profiles
# Fifth run on the Taskbar Tabs welcome-back Spotlight surface. One-variable
# follow-up that puts the FXE-1766 email content (email-only picker, Add buttons
# always visible, no Done button) in front of the FXE-1787 audience: existing
# Windows Release profiles aged 7-28 days at enrollment. control (50%) is a
# no-Spotlight holdback; treatment (50%) sees the Spotlight once on startup.
#
# Cloned from top-sites-welcome-back-spotlight-7-28-day-old-profiles (FXE-1787),
# per the brief: "clone the Jetstream config under the new slug". The six custom
# web-app metrics, the six built-in launch-method metrics and
# [data_sources.web_app_events] are copied VERBATIM from that config (which
# copied them from top-sites-welcome-back-spotlight, orig. world-cup /
# FXE-1640), so this arm reads across against every earlier arm of the surface.
#
# PRIMARY METRIC: DAU, pooled Day 20-28, enrollments basis. That is the
# auto-applied client_level_daily_active_users_v2 with the per_client_dau_impact
# statistic (jetstream/defaults/firefox_desktop.toml), so it is deliberately NOT
# re-listed here. Pinning is a mechanism check this time, not the primary:
# any_web_app_pinned (binomial) is the per-enrolled pin-acceptance rate, and
# per-provider / per-impression funnel reads come from Skylight.
#
# Also auto-applied and NOT re-listed: retained, retained_dau, active_hours,
# uri_count, days_of_use, search_count, tagged_search_count, ad_clicks,
# is_default_browser, unenroll.
#
# SEGMENTS: the ten from FXE-1787 (profile-age bands, activity level,
# default-browser status pre-enrollment, Windows version) plus two NEW
# locale-group segments the brief adds for this run, because the English-only
# email callout rollout (email-pin-tab-taskbar-tab-prompts-treatment-b-rollout)
# has asked en-* Windows profiles to pin email since 2026-04-13 and de/fr/it
# profiles have not been asked.
#
# NOTE ON SEGMENT WINDOWS: window_start/window_end are attributes of the segment
# DATA SOURCE, not of the segment. metric-config-parser's SegmentDefinition has
# only (name, data_source, select_expression, friendly_name, description), and
# unknown keys are silently dropped by cattrs, so window_start/window_end written
# on a [segments.X] block do nothing. Every window in this file is therefore
# declared on the [segments.data_sources.X] block where it is honored. The
# built-in clients_last_seen segment data source declares window_start = 0 and
# window_end = 0, i.e. it is already anchored to the enrollment date.

[experiment]

segments = [
  # Profile age at enrollment
  "profile_age_7_to_14_days",
  "profile_age_15_to_28_days",

  # Activity level (built-in)
  "activity_infrequent",
  "activity_casual",
  "activity_regular",
  "activity_core",

  # Default browser status, measured pre-enrollment
  "firefox_default",
  "firefox_not_default",

  # Windows version
  "windows_10",
  "windows_11",

  # Locale group (NEW for this run)
  "locale_english",
  "locale_de_fr_it",
]

[metrics]

weekly = [
  "installed_web_apps",
  "pinned_apps",
  "web_app_launches",
  "web_app_active_users",
  "any_web_app_installed",
  "any_web_app_pinned",
  "number_of_desktop_launches",
  "number_of_taskbar_launches",
  "number_of_startmenu_launches",
  "number_of_taskbartab_launches",
  "number_of_non_taskbartab_launches",
  "number_of_other_launches",
]

overall = [
  "installed_web_apps",
  "pinned_apps",
  "web_app_launches",
  "web_app_active_users",
  "any_web_app_installed",
  "any_web_app_pinned",
  "number_of_desktop_launches",
  "number_of_taskbar_launches",
  "number_of_startmenu_launches",
  "number_of_taskbartab_launches",
  "number_of_non_taskbartab_launches",
  "number_of_other_launches",
]

[metrics.installed_web_apps.statistics.linear_model_mean]
drop_highest = 0.005
[metrics.pinned_apps.statistics.linear_model_mean]
drop_highest = 0.005
[metrics.web_app_launches.statistics.linear_model_mean]
drop_highest = 0.005
[metrics.web_app_active_users.statistics.binomial]
[metrics.any_web_app_installed.statistics.binomial]
[metrics.any_web_app_pinned.statistics.binomial]
[metrics.number_of_desktop_launches.statistics.linear_model_mean]
drop_highest = 0.005
[metrics.number_of_taskbar_launches.statistics.linear_model_mean]
drop_highest = 0.005
[metrics.number_of_startmenu_launches.statistics.linear_model_mean]
drop_highest = 0.005
[metrics.number_of_taskbartab_launches.statistics.linear_model_mean]
drop_highest = 0.005
[metrics.number_of_non_taskbartab_launches.statistics.linear_model_mean]
drop_highest = 0.005
[metrics.number_of_other_launches.statistics.linear_model_mean]
drop_highest = 0.005

# NOT LISTED: new_profile_retained_week4. Same reason as FXE-1787: its data
# source, clients_first_seen_28_days_later, is keyed on first_seen_date and
# Jetstream joins it on first_seen_date inside the analysis window, so it can
# only match profiles first seen DURING the window. This audience is 7-28 days
# old at enrollment, so the join can never match (and the table has no
# `experiments` column, which makes the generated SQL fail outright).
# Enrollment-anchored W1/W2/W4 retention comes from the auto-applied `retained`
# and `retained_dau`.

# ============================================================================
# CUSTOM METRICS - Web App (Taskbar Tabs) activity
# ============================================================================
# Copied VERBATIM from top-sites-welcome-back-spotlight-7-28-day-old-profiles
# for direct read-across. any_web_app_pinned is the mechanism check for this
# experiment (did the Spotlight recruit pinners); pinned_apps is kept as a count
# for read-across to the mixed-list arms.

[metrics.installed_web_apps]
friendly_name = "Installed Web Apps"
description = "Average Installed Web Apps per user (approx from install and uninstall events)"
select_expression = """
  COALESCE(SUM(CASE WHEN event_name = 'install' THEN cumulative_count END),0) -
  COALESCE(SUM(CASE WHEN event_name = 'uninstall' THEN cumulative_count END),0)
"""
data_source = "web_app_events"

[metrics.pinned_apps]
friendly_name = "Pinned Web Apps"
description = "Average Pinned Web Apps per user (approx from pin and unpin events)"
select_expression = """
  COALESCE(SUM(CASE WHEN event_name = 'pin' THEN cumulative_count END),0) -
  COALESCE(SUM(CASE WHEN event_name = 'unpin' THEN cumulative_count END),0)
"""
data_source = "web_app_events"

[metrics.web_app_launches]
friendly_name = "Web App Launches"
description = "Average Web App Launches per user (approx from activate and install events)"
select_expression = """
  COALESCE(SUM(CASE WHEN event_name = 'activate' THEN cumulative_count END),0) -
  COALESCE(SUM(CASE WHEN event_name = 'install' THEN cumulative_count END),0)
"""
data_source = "web_app_events"

[metrics.web_app_active_users]
friendly_name = "Web App Active Users"
description = "Percentage of clients who had non-zero web app usage time"
select_expression = """
  COALESCE(SUM(metrics.timing_distribution.web_app_usage_time.sum),0) > 0
"""
data_source = "metrics"

[metrics.any_web_app_installed]
friendly_name = "Any Web App Installed"
description = "Client had at least one web app install event during the analysis window"
select_expression = "COALESCE(LOGICAL_OR(event_name = 'install'), FALSE)"
data_source = "web_app_events"

[metrics.any_web_app_pinned]
friendly_name = "Any Web App Pinned"
description = "Client had at least one web app pin event during the analysis window (pin acceptance rate)"
select_expression = "COALESCE(LOGICAL_OR(event_name = 'pin'), FALSE)"
data_source = "web_app_events"

# ============================================================================
# DATA SOURCE - Web App events with cumulative counts
# ============================================================================
# Copied VERBATIM from top-sites-welcome-back-spotlight-7-28-day-old-profiles.
# The '2025-07-31' floor is intentionally NOT re-anchored to this experiment's
# start: the window function computes per-client CUMULATIVE install/pin counts,
# so it must span the client's full web_app history (2025-07-31 is when this
# telemetry began). Re-anchoring it would silently reset every client's
# cumulative baseline to zero and break read-across with the sibling arms.

[data_sources.web_app_events]
from_expression = """(
WITH events AS (
SELECT
    CAST(submission_timestamp as DATE) as submission_date,
    legacy_telemetry_client_id as client_id,
    profile_group_id,
    event_name,
    COUNT(1) as event_count
FROM `moz-fx-data-shared-prod.firefox_desktop.events_stream`
WHERE
    event_category = 'web_app'
    AND event_name IN ('install', 'uninstall', 'pin', 'unpin', 'activate')
    AND DATE(submission_timestamp) >= '2025-07-31'
GROUP BY ALL
)
  SELECT
    submission_date,
    client_id,
    profile_group_id,
    event_name,
    SUM(event_count) OVER (PARTITION BY client_id, event_name ORDER BY submission_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) as cumulative_count
  FROM events
)"""
experiments_column_type = "none"
friendly_name = "Web App Events"
description = "Events for Web App (Taskbar Tabs) with per-client cumulative counts"

# ============================================================================
# SEGMENTS - Profile age at enrollment
# ============================================================================
# Same bands and same SQL as FXE-1787. Follows the enrollment-anchored pattern
# used by the built-in profile_age_* segments in definitions/firefox_desktop.toml:
# DATE_DIFF from the enrollment date to first_seen_date, on the built-in
# clients_last_seen source. Both operands are fixed per client, so the bands are
# exact, strictly disjoint, and independent of the source window. No custom
# data source and no window override are needed.

[segments.profile_age_7_to_14_days]
data_source = "clients_last_seen"
friendly_name = "Profile age 7 to 14 days at enrollment"
description = "Clients whose first_seen_date is 7-14 days before enrollment"
select_expression = """COALESCE(
    DATE_DIFF(MIN(e.enrollment_date), ANY_VALUE(first_seen_date), DAY) BETWEEN 7 AND 14,
    FALSE
)"""

[segments.profile_age_15_to_28_days]
data_source = "clients_last_seen"
friendly_name = "Profile age 15 to 28 days at enrollment"
description = "Clients whose first_seen_date is 15-28 days before enrollment"
select_expression = """COALESCE(
    DATE_DIFF(MIN(e.enrollment_date), ANY_VALUE(first_seen_date), DAY) BETWEEN 15 AND 28,
    FALSE
)"""

# ============================================================================
# SEGMENTS - Default browser status, measured PRE-ENROLLMENT
# ============================================================================
# Same basis as FXE-1787, and the brief asks for it explicitly: "is_default_browser
# on the enrollment day, not during observation, because the treatment moves
# default rate and an observation-period split would condition on an outcome."
#   1. The Spotlight's !willShowDefaultPrompt gate evaluated default status at
#      the startup trigger, so the segment must reflect status going INTO
#      enrollment to quantify the reach cost.
#   2. is_default_browser is an auto-applied metric this treatment moved in
#      FXE-1766 (+1.24%); a -7..-1 window makes segment assignment immune to it.
# Outer COALESCE guards the no-rows-in-window case, which a negative window
# makes possible (LOGICAL_OR/LOGICAL_AND over zero rows returns NULL).

[segments.firefox_default]
data_source = "client_default_history"
friendly_name = "Firefox is default browser (pre-enrollment)"
description = "Firefox was the default browser on at least one ping in the 7 days before enrollment"
select_expression = "COALESCE(LOGICAL_OR(COALESCE(is_default_browser, FALSE)), FALSE)"

[segments.firefox_not_default]
data_source = "client_default_history"
friendly_name = "Firefox is not default browser (pre-enrollment)"
description = "Firefox was never the default browser in the 7 days before enrollment"
select_expression = "COALESCE(LOGICAL_AND(COALESCE(NOT is_default_browser, TRUE)), FALSE)"

# ============================================================================
# SEGMENTS - Windows version (clients_last_seen.windows_build_number; Win11 >= 22000)
# ============================================================================
# Built-in clients_last_seen source, i.e. measured on the enrollment date. OS
# version is not treatment-affected, so no pre-enrollment window is needed.
# Kept as the same custom definitions FXE-1787 used (not the built-in
# windows_10_v1 / windows_11_v1, which sit on clients_daily and classify via
# mozfun.norm.windows_version_info) so the two 7-28-day arms cut identically.
# NEW_SELECTABLE_PROFILE_SPOTLIGHT (priority 2, live since 2026-09-10) is a
# startup competitor on Windows 11 only, which is why this cut matters here.

[segments.windows_10]
data_source = "clients_last_seen"
friendly_name = "Windows 10"
description = "Windows build number in the Windows 10 range (>0 and <22000)"
select_expression = "COALESCE(LOGICAL_OR(COALESCE(windows_build_number > 0 AND windows_build_number < 22000, FALSE)), FALSE)"

[segments.windows_11]
data_source = "clients_last_seen"
friendly_name = "Windows 11"
description = "Windows build number in the Windows 11 range (>=22000)"
select_expression = "COALESCE(LOGICAL_OR(COALESCE(windows_build_number >= 22000, FALSE)), FALSE)"

# ============================================================================
# SEGMENTS - Locale group (NEW for this run)
# ============================================================================
# The experiment enrolls exactly six locales: en-US, en-CA, en-GB, de, fr, it.
# The English three have been asked to pin email by the
# email-pin-tab-taskbar-tab-prompts-treatment-b-rollout callout since
# 2026-04-13; de/fr/it have not, so the two groups arrive with different prior
# exposure. This split makes that visible. It explains a result, it does not
# ship one (ship decision is on segment = all).
# Built-in clients_last_seen source (window 0..0, enrollment day). Locale is
# not treatment-affected. Matching is on the language subtag so a regional
# variant (e.g. de-DE) still lands in the right group; within the enrolled
# population the two groups are exhaustive and disjoint.

[segments.locale_english]
data_source = "clients_last_seen"
friendly_name = "Locale: English (en-US, en-CA, en-GB)"
description = "Clients whose app locale is an English locale on the enrollment date"
select_expression = "COALESCE(LOGICAL_OR(SPLIT(locale, '-')[SAFE_OFFSET(0)] = 'en'), FALSE)"

[segments.locale_de_fr_it]
data_source = "clients_last_seen"
friendly_name = "Locale: de / fr / it"
description = "Clients whose app locale is German, French or Italian on the enrollment date"
select_expression = "COALESCE(LOGICAL_OR(SPLIT(locale, '-')[SAFE_OFFSET(0)] IN ('de', 'fr', 'it')), FALSE)"

# ============================================================================
# SEGMENT DATA SOURCE - pre-enrollment default-browser history
# ============================================================================
# window_start/window_end are declared HERE because this is the only place
# metric-config-parser honors them. -7..-1 is strictly pre-enrollment: it
# excludes the enrollment date itself, so a same-day set-to-default following
# the Spotlight cannot leak into segment assignment. A 7-day lookback is
# right-sized for this audience: every enrolled profile is at least 7 days old,
# so it has clients_last_seen coverage across the whole window.
# The submission_date floor is a performance guard only, anchored to this
# experiment's 2026-09-17 start.

[segments.data_sources.client_default_history]
from_expression = """(
  SELECT
    client_id,
    profile_group_id,
    submission_date,
    is_default_browser
  FROM `mozdata.telemetry.clients_last_seen`
  WHERE submission_date >= DATE_SUB('2026-09-17', INTERVAL 7 DAY)
)"""
window_start = -7
window_end = -1
