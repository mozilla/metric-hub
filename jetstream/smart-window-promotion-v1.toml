[metrics.land_in_smart_window]
friendly_name = "Land In Smart Window User rate"
description = "Rate of Users who land in Smart Window."
data_source = "smart_window_onboarding"
select_expression = "LOGICAL_OR(COALESCE(event_name = 'onboarding_screen_impression', FALSE))"

[metrics.smart_window_adoption]
friendly_name = "Smart Window Adoption"
description = "Users who completed Smart Window Onboarding."
data_source = "smart_window_onboarding"
select_expression = "LOGICAL_OR(COALESCE(event_name = 'onboarding_complete', FALSE))"

[metrics.smart_window_call_out_clicks.statistics.binomial]
[metrics.land_in_smart_window.statistics.binomial]
[metrics.smart_window_adoption.statistics.binomial]

[data_sources]
[data_sources.smart_window_onboarding]
from_expression = """(
  SELECT
    *,
    DATE(submission_timestamp) AS submission_date
  FROM 
    `moz-fx-data-shared-prod.firefox_desktop.events_stream`
  WHERE 
    event_category = 'smart_window'
    AND event_name IN ('onboarding_screen_impression', 'onboarding_complete')
)"""
description = "Glean events_stream (one row per event) filtered to smart Window Onboarding"
friendly_name = "Glean Events Stream Filtered (Smart Window Onboarding)"
experiments_column_type = "none"
client_id_column = "client_id"