[experiment]
enrollment_period = 1

segments = [
    "new_profile",
    "existing_profile",
    "jan_new",
    "jan_existing",
    "feb_new",
    "feb_existing",
    "mar_new",
    "mar_existing",
    "apr_new",
    "apr_existing",
    "may_new",
    "may_existing",
    "jun_new",
    "jun_existing",
    "jul_new",
    "jul_existing",
    "aug_new",
    "aug_existing",
    "sep_new",
    "sep_existing",
]
enrollment_query = """
  SELECT
      e.profile_group_id AS analysis_id,
      `mozfun.map.get_key`(e.event_map_values, 'branch')
          AS branch,
      MIN(e.submission_date) AS enrollment_date,
      COUNT(e.submission_date) AS num_enrollment_events
  FROM
      `moz-fx-data-shared-prod.telemetry.events` e
  WHERE
      e.event_category = 'normandy'
      AND e.event_method = 'enroll'
      AND e.submission_date
          BETWEEN '2026-01-07' AND '2026-09-23'
      AND e.event_string_value = 'long-term-holdback-2026-growth-desktop'
      AND (
        (`mozfun.map.get_key`(e.event_map_values, 'branch') = 'holdback'
          AND `mozdata.udf.safe_sample_id`(e.profile_group_id) < 15)
        OR (`mozfun.map.get_key`(e.event_map_values, 'branch') = 'delivery'
          AND `mozdata.udf.safe_sample_id`(e.profile_group_id) < 1)
      )
  GROUP BY ALL
"""

[segments.new_profile]
data_source = "first_session_pings"
select_expression = """COALESCE(
    DATE_DIFF(
        MIN(e.enrollment_date),
        MIN(IF(ds.submission_date <= e.enrollment_date, profile_creation_date, NULL)),
        DAY
    ) <= 7,
    FALSE
)"""
friendly_name = "New profiles"
description = """
    Profiles created at most 7 days before enrollment, identified by a new-profile
    or first-shutdown ping sent in the 7 days up to the enrollment date.
"""

[segments.existing_profile]
data_source = "first_session_pings"
select_expression = """NOT COALESCE(
    DATE_DIFF(
        MIN(e.enrollment_date),
        MIN(IF(ds.submission_date <= e.enrollment_date, profile_creation_date, NULL)),
        DAY
    ) <= 7,
    FALSE
)"""
friendly_name = "Existing profiles"
description = """
    Every unit not in New profiles: profiles created more than 7 days before
    enrollment, plus new profiles that sent no new-profile or first-shutdown ping.
"""

[segments.jan_new]
data_source = "first_session_pings"
select_expression = """COALESCE(
    DATE_DIFF(
        MIN(e.enrollment_date),
        MIN(IF(ds.submission_date <= e.enrollment_date, profile_creation_date, NULL)),
        DAY
    ) <= 7,
    FALSE
)
AND MIN(e.enrollment_date) BETWEEN '2026-01-01' AND '2026-01-31'"""
friendly_name = "January enrollees, new profiles"
description = """
    Units enrolled in January 2026 that are in New profiles.
"""

