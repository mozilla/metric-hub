[segments.data_sources.first_session_pings]
from_expression = """(
    SELECT
        DATE(submission_timestamp) AS submission_date,
        profile_group_id,
        SAFE.DATE_FROM_UNIX_DATE(SAFE_CAST(environment.profile.creation_date AS INT64)) AS profile_creation_date,
        normalized_os AS os
    FROM `moz-fx-data-shared-prod.telemetry.new_profile`
    UNION ALL
    SELECT
        DATE(submission_timestamp) AS submission_date,
        profile_group_id,
        SAFE.DATE_FROM_UNIX_DATE(SAFE_CAST(environment.profile.creation_date AS INT64)) AS profile_creation_date,
        normalized_os AS os
    FROM `moz-fx-data-shared-prod.telemetry.first_shutdown`
)"""
window_start = -7
window_end = 365
