[experiment]
# Experimenter never saved an enrollment end date for this experiment, so Jetstream hasn't produced any results.
# Setting the enrollment period fixes that.
# We sized this OMC experiment assuming Jetstream would count everyone who sees the message over the entire experiment duration.
# We did not know it only counts users exposed during enrollment (October 20 to 27, 2026).
# The revised enrollment period will allow us to salvage our experiment by ensuring more users who saw the message are counted.
# The revised end date (December 3, 2026) then allows us to measure impact for 21 days post exposure for each of the exposed users.
# We're also adding our H2 search metrics.
enrollment_period = 23
end_date = "2026-12-03"

[metrics]

daily = [
    "sap_clients", "sap_searches_per_searcher", "sap_search_count"
]
weekly = [
    "sap_clients", "sap_searches_per_searcher", "sap_habit_3plus_days", "sap_search_count",
    "serp_tagged_follow_on", "serp_organic", "serp_searches_with_ads", "serp_ad_clicks"
]
# sap_habit_3plus_days is left out of overall on purpose. Overall covers 21 days, so it would count
# 3+ days in 21. The weekly results measure it over each 7-day week, which is what the metric means.
overall = [
    "sap_clients", "sap_searches_per_searcher", "sap_search_count",
    "serp_tagged_follow_on", "serp_organic", "serp_searches_with_ads", "serp_ad_clicks"
]
preenrollment_weekly = [
    "sap_clients", "sap_searches_per_searcher", "sap_habit_3plus_days", "sap_search_count",
    "serp_tagged_follow_on", "serp_organic", "serp_searches_with_ads", "serp_ad_clicks"
]


[metrics.sap_clients]
select_expression = "CAST(COALESCE(SUM(sap_counts_total) > 0, FALSE) AS INT64)"
data_source = "search_clients_daily_glean"
friendly_name = "SAP clients"
description = "Share of clients with a SAP search"
category = "search"

[metrics.sap_clients.statistics.linear_model_mean]
[metrics.sap_clients.statistics.linear_model_mean.covariate_adjustment]
period = "preenrollment_week"

# Local replacement for metric-hub's `search_count`
[metrics.sap_search_count]
select_expression = "COALESCE(SUM(sap_counts_total), 0)"
data_source = "search_clients_daily_glean"
friendly_name = "SAP searches"
description = "Number of searches through Firefox's Search Access Points (Glean sap.counts events)."
category = "search"

[metrics.sap_search_count.statistics.linear_model_mean]
[metrics.sap_search_count.statistics.linear_model_mean.covariate_adjustment]
period = "preenrollment_week"

[metrics.sap_searches_per_searcher]
depends_on = ["sap_search_count", "sap_clients"]
friendly_name = "SAP searches per SAP searcher"
description = """
    This is a Population Ratio Metric. It is the total number of
    searches in the population divided by the
    total number of SAP searchers.
"""
category = "search"

[metrics.sap_searches_per_searcher.statistics.population_ratio]
numerator = "sap_search_count"
denominator = "sap_clients"

[metrics.sap_habit_3plus_days]
friendly_name = "3+ SAP search days in 7"
description = """ 1 if the client had at least one SAP search on 3 or more days
    of the 7-day window, else 0.
"""
data_source = "search_clients_daily_glean"
select_expression = "CAST(COUNT(DISTINCT IF(sap_counts_total > 0, submission_date, NULL)) >= 3 AS INT64)"

[metrics.sap_habit_3plus_days.statistics.linear_model_mean]
[metrics.sap_habit_3plus_days.statistics.linear_model_mean.covariate_adjustment]
period = "preenrollment_week"

[metrics.serp_tagged_follow_on]
select_expression = "COALESCE(SUM(serp_follow_on_searches_tagged_count), 0)"
data_source = "search_clients_daily_glean"
friendly_name = "Tagged follow-on searches"
description = "Tagged SERP impressions reached by refining a search from the results page (Glean SERP events)."
category = "search"

[metrics.serp_tagged_follow_on.statistics.linear_model_mean]
[metrics.serp_tagged_follow_on.statistics.linear_model_mean.covariate_adjustment]
period = "preenrollment_week"

[metrics.serp_organic]
select_expression = "COALESCE(SUM(serp_searches_organic_count), 0)"
data_source = "search_clients_daily_glean"
friendly_name = "Organic searches"
description = "SERP impressions with no partner code (Glean SERP events)."
category = "search"

[metrics.serp_organic.statistics.linear_model_mean]
[metrics.serp_organic.statistics.linear_model_mean.covariate_adjustment]
period = "preenrollment_week"

[metrics.serp_searches_with_ads]
select_expression = "COALESCE(SUM(serp_searches_with_ads_tagged_count + serp_searches_with_ads_organic_count), 0)"
data_source = "search_clients_daily_glean"
friendly_name = "Searches with ads"
description = "SERP impressions, tagged and organic, with at least one ad visible (Glean SERP events)."
category = "search"

[metrics.serp_searches_with_ads.statistics.linear_model_mean]
[metrics.serp_searches_with_ads.statistics.linear_model_mean.covariate_adjustment]
period = "preenrollment_week"

[metrics.serp_ad_clicks]
select_expression = "COALESCE(SUM(serp_ad_clicks_sum), 0)"
data_source = "search_clients_daily_glean"
friendly_name = "Ad clicks"
description = "Ad clicks on SERP impressions, tagged and organic (Glean SERP events)."
category = "search"

[metrics.serp_ad_clicks.statistics.linear_model_mean]
[metrics.serp_ad_clicks.statistics.linear_model_mean.covariate_adjustment]
period = "preenrollment_week"



[data_sources]

[data_sources.search_clients_daily_glean]
from_expression = """(
    SELECT
      -- desktop enrollments are keyed on the legacy client id
      legacy_telemetry_client_id AS client_id,
      -- experiment is randomized on group_id, so Jetstream joins on this
      profile_group_id,
      submission_date,
      sap_counts_total,
      serp_follow_on_searches_tagged_count,
      serp_searches_organic_count,
      serp_searches_with_ads_tagged_count,
      serp_searches_with_ads_organic_count,
      serp_ad_clicks_sum
    FROM
      `mozdata.search.search_clients_daily_glean`
)"""
experiments_column_type = "none"
friendly_name = "Search Clients Daily (Glean)"
description = "Glean search aggregate, one row per client x day x engine x partner code x source"
