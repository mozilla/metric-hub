# ---------------------------------------------------------------------------
# New Tab top sites (tiles) enabled clients
# Based only on newtab_clients_daily.organic_topsites_enabled.
# ---------------------------------------------------------------------------

[metrics.topsites_enabled_clients]
# last reported value in the window, so the overall result reflects the setting at the end of the analysis period
select_expression = """CAST(COALESCE(
    ARRAY_AGG(organic_topsites_enabled IGNORE NULLS ORDER BY submission_date DESC LIMIT 1)[SAFE_OFFSET(0)],
    FALSE
) AS INT64)"""
data_source = "newtab_topsites_daily"
friendly_name = "Top sites enabled clients"
description = """1 if the client's last reported organic top sites (tiles) setting in the window was enabled, else 0.
    The branch mean is the share of the branch with top sites enabled at the end of the window;
    clients with no New Tab data in the window count as 0."""
category = "newtab"

[metrics.topsites_enabled_clients.statistics.linear_model_mean]
[metrics.topsites_enabled_clients.statistics.linear_model_mean.covariate_adjustment]
period = "preenrollment_week"


