[data_sources]

[data_sources.search_clients_daily_glean]
from_expression = """(
    SELECT
      -- desktop enrollments are keyed on the legacy client id
      legacy_telemetry_client_id AS client_id,
      -- experiment is randomized on group_id, so Jetstream joins on this
      profile_group_id,
      submission_date,
      sap_counts_total,
      serp_searches_tagged_count,
      serp_follow_on_searches_tagged_count,
      serp_searches_organic_count,
      serp_searches_with_ads_tagged_count,
      serp_ads_visible_sum,
      serp_ad_clicks_tagged_sum
    FROM
      `mozdata.search.search_clients_daily_glean`
)"""
experiments_column_type = "none"
friendly_name = "Search Clients Daily (Glean)"
description = "Glean search aggregate, one row per client x day x engine x partner code x source"


[data_sources.newtab_topsites_daily]
from_expression = """(
    SELECT
      -- Glean client_id; not used for the join (Jetstream joins on profile_group_id)
      client_id,
      -- experiment is randomized on group_id, so Jetstream joins on this
      profile_group_id,
      submission_date,
      organic_topsites_enabled
    FROM
      `mozdata.firefox_desktop.newtab_clients_daily`
)"""
experiments_column_type = "none"
friendly_name = "New Tab top sites daily"
# not named newtab_clients_daily: that name is a metric-hub data source and a local definition would override it for the do-no-harm metrics
description = "organic_topsites_enabled from New Tab client-level data, one row per client x day"


[data_sources.urlbar_recent_search_daily]
from_expression = """(
    SELECT
      -- desktop enrollments are keyed on the legacy client id
      legacy_telemetry_client_id AS client_id,
      -- experiment is randomized on group_id, so Jetstream joins on this
      profile_group_id,
      submission_date,
      COUNTIF(
        is_terminal
        AND EXISTS (SELECT 1 FROM UNNEST(results) AS r WHERE r.product_result_type = 'recent_search')
      ) AS recent_search_impressions,
      COUNTIF(
        event_action = 'annoyance' AND product_selected_result = 'recent_search'
      ) AS recent_search_annoyances,
      COUNTIF(
        is_terminal
        AND EXISTS (SELECT 1 FROM UNNEST(results) AS r WHERE r.product_result_type = 'admarketplace_sponsored')
      ) AS admarketplace_sponsored_impressions,
      COUNTIF(
        event_action = 'engaged' AND product_selected_result = 'admarketplace_sponsored'
      ) AS admarketplace_sponsored_clicks
    FROM
      `mozdata.firefox_desktop.urlbar_events`
    GROUP BY
      client_id,
      profile_group_id,
      submission_date
)"""
experiments_column_type = "none"
friendly_name = "urlbar recent_search and sponsored daily"
description = "urlbar events rolled up to client x day: recent_search impressions and annoyances, admarketplace_sponsored impressions and clicks"


[segments]

[segments.pre_enrollment_low_sap_searchers]
friendly_name = "Pre-enrollment low SAP searchers"
description = "Clients with between one and 10 SAP searches in the 28 days before enrollment."
select_expression = "COALESCE(SUM(sap_searches), 0) BETWEEN 1 AND 10"
data_source = "pre_enrollment_activity"

[segments.pre_enrollment_high_sap_searchers]
friendly_name = "Pre-enrollment high SAP searchers"
description = "Clients with more than 10 SAP searches in the 28 days before enrollment."
select_expression = "COALESCE(SUM(sap_searches), 0) > 10"
data_source = "pre_enrollment_activity"

[segments.pre_enrollment_non_sap_searchers]
friendly_name = "Pre-enrollment non-SAP searchers"
description = "Clients active in the 28 days before enrollment with no SAP searches."
select_expression = "COALESCE(SUM(sap_searches), 0) = 0"
data_source = "pre_enrollment_activity"


[segments.new_profiles]
friendly_name = "New profiles"
description = "Profiles less than 28 days old on enrollment day (days since first_seen_date)."
select_expression = "COALESCE(MIN(profile_age_days) < 28, FALSE)"
data_source = "enrollment_day_profile_age"

[segments.established_profiles]
friendly_name = "Established profiles"
description = "Profiles 28 or more days old on enrollment day (days since first_seen_date)."
select_expression = "COALESCE(MIN(profile_age_days) >= 28, FALSE)"
data_source = "enrollment_day_profile_age"


[segments.data_sources.pre_enrollment_activity]
from_expression = """(
    WITH sap AS (
      -- grain is client x day x engine x partner code x source; roll up to client x day
      SELECT
        client_id,
        submission_date,
        SUM(sap_counts_total) AS sap_searches
      FROM
        `mozdata.search.search_clients_daily_glean`
      GROUP BY
        client_id,
        submission_date
    )
    SELECT
      -- desktop enrollments are keyed on the legacy client id
      bcd.legacy_telemetry_client_id AS client_id,
      -- experiment is randomized on group_id, so Jetstream joins on this
      bcd.profile_group_id,
      bcd.submission_date,
      sap.sap_searches
    FROM
      `mozdata.firefox_desktop.baseline_clients_daily` AS bcd
    LEFT JOIN
      sap
      USING (client_id, submission_date)
)"""
# Days relative to enrollment: the 28 days before enrollment day.
window_start = -28
window_end = -1


[segments.data_sources.enrollment_day_profile_age]
from_expression = """(
    SELECT
      -- desktop enrollments are keyed on the legacy client id
      legacy_telemetry_client_id AS client_id,
      -- experiment is randomized on group_id, so Jetstream joins on this
      profile_group_id,
      submission_date,
      DATE_DIFF(submission_date, first_seen_date, DAY) AS profile_age_days
    FROM
      `mozdata.firefox_desktop.baseline_clients_daily`
)"""
# Enrollment day only, so profile age is measured as of enrollment.
# New profiles may have no rows before enrollment, so a pre-enrollment window would drop them.
window_start = 0
window_end = 0
