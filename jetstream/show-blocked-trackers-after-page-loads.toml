[metrics]
weekly = ["privacy_panel_clicks"]
overall = ["privacy_panel_clicks"]

# Metric for total number of privacy panel (Trust Panel) opens.
# Uses the current trustpanel.opened event; the legacy
# security.ui.protectionspopup.open_protections_popup event is not sent by the Trust Panel.
[metrics.privacy_panel_clicks]
select_expression = """
COALESCE(SUM(CASE
  WHEN event_category = 'trustpanel'
  AND event_name = 'opened'
  THEN 1
  ELSE 0
END), 0)
"""
data_source = "trustpanel_events_stream"
friendly_name = "Privacy Panel Clicks"
description = "Total number of times users opened the privacy panel (Trust Panel)"

[metrics.privacy_panel_clicks.statistics.bootstrap_mean]

[metrics.privacy_panel_clicks.statistics.deciles]

# Custom data source filtered for trustpanel events
[data_sources.trustpanel_events_stream]
from_expression = """
(
  SELECT
    legacy_telemetry_client_id,
    profile_group_id,
    DATE(submission_timestamp) AS submission_date,
    event_category,
    event_name
  FROM `moz-fx-data-shared-prod.firefox_desktop.events_stream`
  WHERE event_category = 'trustpanel'
)
"""
experiments_column_type = "none"
client_id_column = "legacy_telemetry_client_id"
friendly_name = "Trust Panel Events Stream"
description = "Glean events_stream filtered for trustpanel category"
