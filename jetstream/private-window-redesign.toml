# Custom Jetstream config for private-window-redesign
# Framing: do no harm — retention/engagement guardrails covered by Jetstream defaults.
# Custom metrics focus on PBW-specific usage signal.

[experiment]
enrollment_period = 7
segments = ["regular_users_v3", "new_or_resurrected_v3"]

[experiment.exposure_signal]
name = "opened_pbw"
friendly_name = "Opened Private Browsing Window"
description = "Clients who opened a Private Browsing Window during the analysis window"
select_expression = "COALESCE(dom_parentprocess_private_window_used, false)"
data_source = "clients_daily"
window_end = "analysis_window_end"

[metrics]
weekly = ["pbw_open_count", "pbw_distinct_days", "pbw_any_usage"]
28_day = ["pbw_open_count", "pbw_distinct_days", "pbw_any_usage"]
overall = ["pbw_open_count", "pbw_distinct_days", "pbw_any_usage"]

# Primary: total PBW opens from all tracked UI entry points.
# Covers ~95% of UI-initiated opens (app menu, keyboard, context menu, menu bar, toolbar).
[metrics.pbw_open_count]
select_expression = "COALESCE(SUM(open_count), 0)"
data_source = "pbw_usage"
friendly_name = "PBW Open Count"
description = "Total private browsing window opens from all tracked UI entry points in the analysis window"
bigger_is_better = true
analysis_bases = ["enrollments", "exposures"]

[metrics.pbw_open_count.statistics.bootstrap_mean]
[metrics.pbw_open_count.statistics.deciles]

# Secondary: number of distinct days with PBW usage
[metrics.pbw_distinct_days]
select_expression = "COALESCE(COUNT(DISTINCT IF(used_pbw, submission_date, NULL)), 0)"
data_source = "pbw_usage"
friendly_name = "PBW Distinct Usage Days"
description = "Number of distinct days the client used Private Browsing in the analysis window"
bigger_is_better = true
analysis_bases = ["enrollments", "exposures"]

[metrics.pbw_distinct_days.statistics.bootstrap_mean]
[metrics.pbw_distinct_days.statistics.deciles]

# Guardrail: any PBW usage at all
[metrics.pbw_any_usage]
select_expression = "COALESCE(LOGICAL_OR(used_pbw), FALSE)"
data_source = "pbw_usage"
friendly_name = "Any PBW Usage"
description = "Proportion of clients who used Private Browsing at all in the analysis window"
bigger_is_better = true
analysis_bases = ["enrollments", "exposures"]

[metrics.pbw_any_usage.statistics.binomial]

# ── DATA SOURCES ──

[data_sources.pbw_usage]
from_expression = """(
  SELECT
    p.*,
    p.metrics.uuid.legacy_telemetry_profile_group_id AS profile_group_id,
    DATE(p.submission_timestamp) AS submission_date,
    COALESCE((SELECT SUM(kv.value) FROM UNNEST(p.metrics.labeled_counter.browser_ui_interaction_app_menu) kv WHERE kv.key = 'appMenu-new-private-window-button2'), 0)
    + COALESCE((SELECT SUM(kv.value) FROM UNNEST(p.metrics.labeled_counter.browser_ui_interaction_keyboard) kv WHERE kv.key = 'key-privatebrowsing'), 0)
    + COALESCE((SELECT SUM(kv.value) FROM UNNEST(p.metrics.labeled_counter.browser_ui_interaction_content_context) kv WHERE kv.key = 'context-openlinkprivate'), 0)
    + COALESCE((SELECT SUM(kv.value) FROM UNNEST(p.metrics.labeled_counter.browser_ui_interaction_menu_bar) kv WHERE kv.key = 'menu-newPrivateWindow'), 0)
    + COALESCE((SELECT SUM(kv.value) FROM UNNEST(p.metrics.labeled_counter.browser_ui_interaction_nav_bar) kv WHERE kv.key = 'privatebrowsing-button'), 0) AS open_count,
    p.metrics.boolean.dom_parentprocess_private_window_used AS used_pbw
  FROM `mozdata.firefox_desktop.metrics` p
)"""
experiments_column_type = "glean"
client_id_column = "metrics.uuid.legacy_telemetry_client_id"
friendly_name = "PBW Usage"
description = "Per-ping PBW open counts and usage boolean from the Glean metrics table"
